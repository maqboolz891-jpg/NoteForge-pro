<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoteForge Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        canvas: '#1e1e24',
                        surface: '#282830',
                        accent: '#6366f1',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .canvas-bg {
            background-image: radial-gradient(#4b5563 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="h-full bg-canvas text-gray-100 flex flex-col font-sans overflow-hidden">
    <header class="h-14 bg-surface border-b border-gray-700/50 flex items-center justify-between px-4 z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <h1 id="doc-title" class="font-semibold text-base truncate max-w-xs">NoteForge Pro</h1>
            <span class="text-xs px-2 py-0.5 bg-indigo-500/20 text-indigo-400 rounded-full font-medium">Moto Tab 60 Pro Ready</span>
        </div>
        <div class="flex items-center space-x-1 bg-canvas/80 p-1 rounded-xl border border-gray-700/50 shadow-inner">
            <button title="Fountain Pen" data-tool="pen" class="tool-btn p-2 rounded-lg bg-indigo-600 text-white transition"><i class="fa-solid fa-pen-nib"></i></button>
            <button title="Felt Pen" data-tool="felt" class="tool-btn p-2 rounded-lg text-gray-400 hover:text-white transition"><i class="fa-solid fa-marker"></i></button>
            <button title="Brush Pen" data-tool="brush" class="tool-btn p-2 rounded-lg text-gray-400 hover:text-white transition"><i class="fa-solid fa-paintbrush"></i></button>
            <button title="Highlighter" data-tool="highlighter" class="tool-btn p-2 rounded-lg text-gray-400 hover:text-white transition"><i class="fa-solid fa-highlighter"></i></button>
            <button title="Eraser" data-tool="eraser" class="tool-btn p-2 rounded-lg text-gray-400 hover:text-white transition"><i class="fa-solid fa-eraser"></i></button>
        </div>
    </header>
    <main class="flex-1 relative canvas-bg overflow-hidden">
        <canvas id="drawing-canvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>
    </main>
    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        let currentTool = 'pen', currentColor = '#6366f1', currentPressure = 1, isDrawing = false, palmRejection = true;
        let strokes = [], currentStroke = [];
        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; redraw(); }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        canvas.addEventListener('pointerdown', (e) => {
            if (palmRejection && e.pointerType === 'touch') return;
            isDrawing = true; currentPressure = e.pressure > 0 ? e.pressure : 0.5;
            currentStroke = [{x: e.offsetX, y: e.offsetY, pressure: currentPressure}];
        });
        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || (palmRejection && e.pointerType === 'touch')) return;
            currentPressure = e.pressure > 0 ? e.pressure : 0.5;
            currentStroke.push({x: e.offsetX, y: e.offsetY, pressure: currentPressure});
            redraw();
            drawStroke(currentStroke, currentColor, currentTool, currentPressure);
        });
        canvas.addEventListener('pointerup', () => {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentStroke.length > 0) strokes.push({points: currentStroke, color: currentColor, tool: currentTool});
            currentStroke = [];
        });
        function drawStroke(points, color, tool, pressure) {
            if (points.length < 2) return;
            ctx.save(); ctx.beginPath(); ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            if (tool === 'pen') ctx.lineWidth = pressure * 4;
            else if (tool === 'felt') ctx.lineWidth = 6;
            else if (tool === 'brush') { ctx.lineWidth = pressure * 12; ctx.globalAlpha = 0.7; }
            else if (tool === 'highlighter') { ctx.lineWidth = 20; ctx.globalAlpha = 0.3; }
            else if (tool === 'eraser') { ctx.globalCompositeOperation = 'destination-out'; ctx.lineWidth = 24; }
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke(); ctx.restore();
        }
        function redraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); strokes.forEach(s => drawStroke(s.points, s.color, s.tool, 1)); }
    </script>
</body>
</html>
